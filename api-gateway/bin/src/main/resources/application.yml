server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: customer-service
          uri: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/customers/**
        - id: shipment-service
          uri: ${SHIPMENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/shipments/**
        - id: hub-delivery-service
          uri: ${HUB_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/hubs/**, /api/v1/deliveries/**
        - id: tracking-service
          uri: ${TRACKING_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/tracking/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/notifications/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
